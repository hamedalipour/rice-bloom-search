<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>عطر شالیزار | در حال انتقال...</title>
    <script>
      // فال‌بک SPA برای GitHub Pages:
      // مسیر درخواستی ذخیره و به صفحه اصلی هدایت می‌شود تا اپ React مسیر را بازیابی کند.
      try {
        sessionStorage.setItem(
          "spa-redirect",
          location.pathname + location.search + location.hash,
        );
      } catch (e) {}
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
